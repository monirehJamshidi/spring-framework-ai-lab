server:
  port: 8081

behsazan:
  development4:
    project: InternetBank

spring:
  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:4b-instruct
        think: false
        temperature: 0.2
        num-predict: 256
        num-ctx: 1024

  profiles:
    active: master

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update


logging:
  level:
    org.j2os.common.aspect: DEBUG




